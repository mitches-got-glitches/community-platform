---
# Secret-shaped variables for every host. Per ADR-0007, no plaintext secret ever lives
# in this file (or anywhere else in the repo) — each one is resolved from an
# environment variable that `pass-cli run` injects at execution time, the same pattern
# `just tofu-plan`/`just tofu-apply` already use for HCLOUD_TOKEN. See ../../README.md
# § Secrets for the full walkthrough.
#
# No role currently consumes a secret (roles/ is still placeholder — see KICKOFF/#12),
# so there is nothing to define yet. When a role needs one, add it here as:
#
#   some_secret: "{{ lookup('ansible.builtin.env', 'SOME_SECRET') }}"
#
# and source it via a `pass-cli run` justfile recipe, never a committed value.
